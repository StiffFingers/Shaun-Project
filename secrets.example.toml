# Copy these settings into Streamlit Cloud:
#   App → Manage app → Settings → Secrets
#
# Or for local testing:
#   mkdir -p .streamlit
#   cp secrets.example.toml .streamlit/secrets.toml
#   then edit passwords (use: python3 hash_password.py)

# --- Login (email / password) ---
[auth]
enabled = true

[auth.credentials]
"you@example.com" = "$2b$12$REPLACE_WITH_HASH_FROM_hash_password_py"
"coworker@example.com" = "$2b$12$REPLACE_WITH_ANOTHER_HASH"

[auth.names]
"you@example.com" = "Your Name"
"coworker@example.com" = "Coworker Name"

# --- Supabase (permanent database — required on Streamlit Cloud) ---
# Project Settings → API:
#   url  = Project URL
#   key  = service_role key (secret) — NOT the anon key
# Run supabase_schema.sql once in Supabase → SQL Editor first.
[supabase]
url = "https://YOUR_PROJECT_REF.supabase.co"
key = "YOUR_SERVICE_ROLE_SECRET_KEY"
